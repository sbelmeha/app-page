<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{ page.title | escape }} · Reflex</title>
  <meta name="description" content="{{ page.description | default: 'Reflex turns movement into light and sound, on iPhone and iPad.' | escape }}">
  <link rel="canonical" href="https://rflx.app{{ page.url }}">
  <link rel="icon" href="/assets/reflex-icon-180.png" type="image/png">
  <link rel="stylesheet" href="/assets/reflex.css">
</head>
<body class="{{ page.body_class | default: 'document-page' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Reflex home">reflex</a>
    </header>
    {{ content }}
    <footer class="site-footer">
      <nav aria-label="Footer">
        <a href="/privacypolicy/">Privacy Policy</a>
        <a href="/terms/">Terms of Use</a>
        <a href="mailto:rflx.app@gmail.com">Contact</a>
      </nav>
    </footer>
  </div>
</body>
</html>
