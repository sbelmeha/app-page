<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{ page.title | escape }} · Jar</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="https://rflx.app{{ page.url }}">
  <link rel="icon" href="/jar/icon-180.png" type="image/png">
  <link rel="apple-touch-icon" href="/jar/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/jar/legal.css">
</head>
<body>
<main class="legal" id="main">
  <header>
    <a class="brand" href="/jar/"><img src="/jar/icon-180.png" alt="Jar app icon" width="30" height="30">Jar <span>for iPhone</span></a>
  </header>
  <h1>{{ page.title }}</h1>
  <p class="updated">Last updated {{ page.updated }}</p>
  <article>{{ content }}</article>
  <footer>
    <nav aria-label="Footer">
      <a href="/jar/privacy/">Privacy Policy</a>
      <a href="/jar/terms/">Terms of Use</a>
      <a href="mailto:rflx.app@gmail.com">Contact</a>
    </nav>
  </footer>
</main>
</body>
</html>
